name: Build and Push Docker Images

# запускаем при пуше в review
on:
  push:
    branches: ["review"]

env:
  REGISTRY: ghcr.io
  # Базовое имя: gh6u9do/film-react-nest
  # К нему добавим /frontend, /backend, /nginx

jobs:
  # собираем фронтенд
  build-frontend:
    runs-on: ubuntu-latest
    # описываем права
    permissions:
      contents: read
      packages: write

    steps:
        # клонируем весь репозиторий на виртуалку
      - name: Checkout repository
        uses: actions/checkout@v4

        # используем Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

        # логин в Registry
      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

        # собираем и пушим образ фронтенд контейнера
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          # указываем где искать директорию с Dockerfile и файлами проекта
          context: ./frontend
          # указываем что нужно запушить образ в Registery
          push: true
          # полное имя образа в Registery
          tags: ${{ env.REGISTRY }}/gh6u9do/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # собираем бэкенд
  build-backend:
    runs-on: ubuntu-latest
    # описываем права
    permissions:
      contents: read
      packages: write

    steps:
        # клонируем репозиторий на виртуалку
      - name: Checkout repository
        uses: actions/checkout@v4

        # используем Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

        # логин в Registry
      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

        # собираем и пушим образ бэкенда
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/gh6u9do/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # собираем nginx
  build-nginx:
    runs-on: ubuntu-latest
    # описываем права
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push nginx
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          push: true
          tags: ${{ env.REGISTRY }}/gh6u9do/nginx:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
